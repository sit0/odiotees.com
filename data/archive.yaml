- source: "Fundacja Helisa"
  url: "https://helisafoundation.pl/aleksandra-ozimek/"
  title:
    pl: "Moje portfolio i biografia"
    en: "My portfolio and biography"
    de: "Mein Portfolio und meine Biografie"
  desc:
    pl: "Opisali mnie tam jako jedną z najbarwniejszych postaci łódzkiego offu — piszą, skąd u mnie ta miłość do recyklingu, surrealnej formy i wieży ODIO w Staniszowie."
    en: "They describe me there as one of the most colourful figures of Łódź's off-scene — and get into why I love recycling, surreal form and the ODIO tower in Staniszów."
    de: "Dort werde ich als eine der schillerndsten Figuren der Łódźer Off-Szene beschrieben — mit Erklärungen, woher meine Liebe zu Recycling, surrealer Form und dem ODIO-Turm in Staniszów kommt."

