hero-sub:
  other: "Ich bin Ola Ozimek, komme aus Jelenia Góra, bin aber in ganz Polen unterwegs und ein bisschen in Berlin. ODIO TEES ist meine Marke — Designerstücke, T-Shirts, Hoodies und Leggings, die ich von Hand veredle: mit Hologrammfolie, UV-Leuchtfarbe, 3D-Druck und Puffdruck. Ich suche keine Korrektheit. Ich suche eine Form, die es noch nicht gab."

tag-01:
  other: "// 01 — Manifest"
manifest-h2:
  other: "Recycling als Ausgangspunkt"
manifest-p1:
  other: "Ich finde Materialien in Secondhand-Läden, bei billigen Ausverkäufen, manchmal im Müll. Dann arbeite ich sie um — nähe um, füge hinzu, behänge sie mit Accessoires, mische Genres und Ästhetiken, bis die Funktion nicht mehr zählt und die Form zur Hauptsache wird."
manifest-p2:
  other: "Außen und Futter verwechsle ich oft — absichtlich. In meinen Kleidungsstücken ist ein Ärmel manchmal länger als der andere, ein Kragen geht in einen Schleier über, und ein verlorener Handschuh kann als Schuhschmuck enden. Ich schöpfe reichlich aus der heutigen Popkultur und aus fernen Kulturen, aber am nächsten steht mir immer die Straßenkunst."
