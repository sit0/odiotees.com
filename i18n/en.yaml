hero-h1-3:
  other: "not copies."
hero-sub:
  other: "I'm Ola Ozimek, from Jelenia Góra, playing across Poland and a bit in Berlin. ODIO TEES is my brand — designer pieces, t-shirts, hoodies and leggings that I decorate by hand: with holographic foil, UV-glow paint, 3D print and puff. I'm not after correctness. I'm after a form that hasn't existed yet."

tag-01:
  other: "// 01 — manifesto"
manifest-h2:
  other: "Recycling as a starting point"
manifest-p1:
  other: "I find materials in second-hand shops, at cheap sales, sometimes in the trash. Then I rework them — resewing, adding pieces, hanging them with trinkets, mixing genres and aesthetics, until function stops being the point and form takes over."
manifest-p2:
  other: "The outside and lining often get mixed up in my work — on purpose. In my clothes one sleeve is sometimes longer than the other, a collar turns into a veil, and a lost glove might end up as a shoe ornament. I pull freely from today's pop culture and from distant cultures, but I always feel closest to street art."
