# ============================================================================
# i18n/pl.yaml — polskie teksty interfejsu i treści strony.
#
# Format: każdy klucz ma pod-klucz "other" (wymóg formatu Hugo/go-i18n,
# używany też przy odmianach liczby mnogiej — tutaj go nie potrzebujemy,
# ale musi być obecny).
#
# Jak edytować: zmień tekst w cudzysłowie po "other:". Zachowaj cudzysłowy
# na początku i końcu. Jeśli tekst sam zawiera cudzysłów ("), poprzedź go
# znakiem \ (backslash), np. "przykład z \"cudzysłowem\" w środku".
# ============================================================================

