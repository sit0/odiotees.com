hero-sub:
  other: "Jestem Ola Ozimek, pochodzę z Jeleniej Góry, ale gram na całą Polskę i trochę na Berlin. ODIO TEES to moja marka — designerskie projekty, koszulki, bluzy i legginsy, które zdobię ręcznie: folią hologramową, farbą świecącą w UV, drukiem 3D i puffem. Nie szukam poprawności. Szukam formy, której jeszcze nie było."

tag-01:
  other: "// 01 — manifest"
manifest-h2:
  other: "Recykling jako punkt wyjścia"
manifest-p1:
  other: "Materiały znajduję w second handach, na tanich wyprzedażach, czasem na śmietniku. Potem je przerabiam — przeszywam, doszywam, obwieszam gadżetami, mieszam gatunki i estetyki, aż funkcja przestaje być najważniejsza, a najważniejsza staje się forma."
manifest-p2:
  other: "Wierzch i podszewka często mi się mylą — celowo. W moich ubraniach jeden rękaw bywa dłuższy od drugiego, kołnierzyk przechodzi w welon, a zgubiona rękawiczka może wylądować jako ozdoba buta. Czerpię garściami z dzisiejszego popu i z odległych kultur, ale najbliżej mi zawsze do sztuki ulicy."
